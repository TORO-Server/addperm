name: AddPerm
version: 1.2.1
main: prj.salmon.addparm.Add_parm
api-version: 1.20
commands:
  addbuilder:
    description: Add a player to the builder group.
    usage: /addbuilder <MCID>
    permission: addbuilder.use
  delbuilder:
    description: Delete a player to the buiilder group.
    usage: /delbuilder <MCID>
    permission: addbuilder.use
  adddriver:
    description: Add a player to the driver group.
    usage: /adddriver <MCID>
    permission: addbuilder.use
  deldriver:
    description: Delete a player to the driver group.
    usage: /deldriver <MCID>
    permission: addbuilder.use